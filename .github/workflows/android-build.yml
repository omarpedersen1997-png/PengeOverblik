name: Build PengeOverblik 1.5.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'PengeOverblik-1.5.0-systemnotifikationer.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Kontroller ZIP-fil
        shell: bash
        run: |
          ZIP="./PengeOverblik-1.5.0-systemnotifikationer.zip"

          if [ ! -f "$ZIP" ]; then
            echo "FEJL: ZIP-filen PengeOverblik-1.5.0-systemnotifikationer.zip mangler i repositoryets øverste mappe."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Android-projekt
        shell: bash
        run: |
          ROOT=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "FEJL: settings.gradle.kts blev ikke fundet i ZIP-filen."
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Projekt fundet i: $ROOT"

      - name: Konfigurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Byg APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PengeOverblik-1.5.0-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
