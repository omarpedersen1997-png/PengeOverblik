name: Build PengeOverblik 2.0.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'PengeOverblik-2.0.0-fuldt-redesign.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Kontroller og pak ZIP ud
        shell: bash
        run: |
          ZIP="./PengeOverblik-2.0.0-fuldt-redesign.zip"

          if [ ! -f "$ZIP" ]; then
            echo "FEJL: PengeOverblik 2.0.0 ZIP-filen blev ikke fundet."
            echo "Kontroller, at ZIP-filen ligger i repositoryets øverste mappe."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Android-projekt
        shell: bash
        run: |
          ROOT=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "FEJL: settings.gradle.kts blev ikke fundet."
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Android-projekt fundet: $ROOT"

      - name: Konfigurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Byg Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Kontroller app-version
        shell: bash
        run: |
          grep -R -n 'versionName' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Upload PengeOverblik 2.0.0 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PengeOverblik-2.0.0-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
