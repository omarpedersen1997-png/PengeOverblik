name: Build PengeOverblik

on:
  workflow_dispatch:
  push:
    paths:
      - 'PengeOverblik-*.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Pak projektet ud
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'PengeOverblik-*.zip' | sort | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "FEJL: Ingen PengeOverblik-ZIP blev fundet."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          ROOT=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "FEJL: Projektet blev ikke fundet i ZIP-filen."
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Konfigurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Byg APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Gem APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PengeOverblik-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
