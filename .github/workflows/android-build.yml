name: Build PengeOverblik

on:
  workflow_dispatch:
  push:
    paths:
      - 'PengeOverblik-redesign-1.2.0-GitHub-klar.zip'
      - 'PengeOverblik-redesign-1.2.0-uden-ekstra-mappe.zip'
      - 'PengeOverblik-redesign-1.2.0-*.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Find og pak redesign ud
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'PengeOverblik-redesign-1.2.0-*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Redesign-ZIP blev ikke fundet i repositoryets rod."
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Fandt ikke settings.gradle.kts i ZIP-filen."
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Konfigurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Byg APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: PengeOverblik-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
